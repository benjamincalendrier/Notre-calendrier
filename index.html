<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notre Calendrier</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .app {
      max-width: 900px;
      margin: auto;
      background: white;
      min-height: 100vh;
    }

    .header {
      padding: 14px;
      background: white;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #ddd;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 15px;
      background: #eee;
    }

    .month {
      font-size: 23px;
      font-weight: bold;
      margin-top: 12px;
      text-transform: capitalize;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-top: 12px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-top: 1px solid #ddd;
      border-left: 1px solid #ddd;
    }

    .day {
      min-height: 105px;
      border-right: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      padding: 3px;
      background: white;
      overflow: hidden;
    }

    .other-month {
      background: #fafafa;
      color: #aaa;
    }

    .today {
      box-shadow: inset 0 0 0 2px #30b86b;
    }

    .day-number {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .event {
      font-size: 10px;
      line-height: 1.2;
      padding: 3px 4px;
      margin-bottom: 2px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #111;
    }

    .more {
      font-size: 10px;
      font-weight: bold;
      color: #666;
    }

    .add {
      position: fixed;
      right: 20px;
      bottom: 22px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #1db954;
      color: white;
      font-size: 30px;
      box-shadow: 0 4px 15px #999;
    }

    dialog {
      width: 92%;
      max-width: 430px;
      border: 0;
      border-radius: 16px;
      padding: 0;
    }

    dialog::backdrop {
      background: rgba(0,0,0,.4);
    }

    .modal {
      padding: 18px;
    }

    .modal h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #bbb;
      border-radius: 9px;
      padding: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 70px;
    }

    .colors {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .color {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      padding: 0;
      border: 3px solid transparent;
    }

    .color.selected {
      border-color: #222;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .save {
      background: #222;
      color: white;
    }

    .delete {
      background: #ffd7d7;
      color: #900;
      margin-right: auto;
    }

    .event-list-item {
      padding: 10px;
      margin-bottom: 7px;
      border-radius: 8px;
      font-size: 15px;
    }

    .search-result {
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      font-size: 15px;
    }

    .search-date {
      font-weight: bold;
      margin-bottom: 3px;
    }

    @media(max-width: 500px) {
      .day {
        min-height: 95px;
      }

      .event {
        font-size: 9px;
        padding: 2px 3px;
      }

      .day-number,
      .more {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="topline">
      <h1>Notre Calendrier</h1>

      <div>
        <button onclick="openSearch()">🔍</button>
        <button onclick="previousMonth()">‹</button>
        <button onclick="goToday()">Aujourd'hui</button>
        <button onclick="nextMonth()">›</button>
      </div>
    </div>

    <div class="month" id="monthTitle"></div>

    <div class="weekdays">
      <div>Lun</div>
      <div>Mar</div>
      <div>Mer</div>
      <div>Jeu</div>
      <div>Ven</div>
      <div>Sam</div>
      <div>Dim</div>
    </div>

  </div>

  <div class="calendar" id="calendar"></div>

</div>

<button class="add" onclick="openNewEvent()">+</button>

<dialog id="eventDialog">

  <div class="modal">

    <h2 id="dialogTitle">Nouvel événement</h2>

    <label>Date</label>
    <input type="date" id="startDate">

    <label>Jusqu'au (facultatif)</label>
    <input type="date" id="endDate">

    <label>Événement</label>
    <textarea
      id="eventText"
      placeholder="Exemple : Piscine 10h">
    </textarea>

    <label>Couleur</label>

    <div class="colors" id="colors"></div>

    <div class="actions">

      <button
        class="delete"
        id="deleteButton"
        onclick="deleteEvent()">
        Supprimer
      </button>

      <button onclick="closeDialog()">
        Annuler
      </button>

      <button
        class="save"
        onclick="saveEvent()">
        Enregistrer
      </button>

    </div>

  </div>

</dialog>

<dialog id="dayDialog">

  <div class="modal">

    <h2 id="dayTitle"></h2>

    <div id="dayEvents"></div>

    <div class="actions">

      <button onclick="addFromDay()">
        Ajouter
      </button>

      <button onclick="document.getElementById('dayDialog').close()">
        Fermer
      </button>

    </div>

  </div>

</dialog>

<dialog id="searchDialog">

  <div class="modal">

    <h2>Rechercher</h2>

    <input
      type="text"
      id="searchInput"
      placeholder="Exemple : mazout"
      oninput="searchEvents()">

    <div
      id="searchResults"
      style="margin-top:15px;">
    </div>

    <div class="actions">

      <button onclick="closeSearch()">
        Fermer
      </button>

    </div>

  </div>

</dialog>

<script>

const COLORS = [
  "#b9ddff",
  "#b9efc6",
  "#ffc5d3",
  "#ffd2a8",
  "#d8c9ff",
  "#d5d5d5"
];

let displayedMonth = new Date();

displayedMonth =
  new Date(
    displayedMonth.getFullYear(),
    displayedMonth.getMonth(),
    1
  );

let selectedColor = COLORS[0];

let editingId = null;

let selectedDay = null;

function dateString(date) {

  const y = date.getFullYear();

  const m =
    String(date.getMonth() + 1)
    .padStart(2, "0");

  const d =
    String(date.getDate())
    .padStart(2, "0");

  return y + "-" + m + "-" + d;
}

function loadEvents() {

  const saved =
    localStorage.getItem("familyCalendar");

  if (!saved)
    return [];

  return JSON.parse(saved);
}

function storeEvents(events) {

  localStorage.setItem(
    "familyCalendar",
    JSON.stringify(events)
  );
}

function eventsForDay(day) {

  return loadEvents().filter(event => {

    const end =
      event.end || event.start;

    return (
      event.start <= day &&
      end >= day
    );

  });
}

function renderCalendar() {

  const calendar =
    document.getElementById("calendar");

  calendar.innerHTML = "";

  document.getElementById("monthTitle")
    .textContent =
      displayedMonth.toLocaleDateString(
        "fr-FR",
        {
          month: "long",
          year: "numeric"
        }
      );

  const first =
    new Date(displayedMonth);

  let weekday =
    first.getDay();

  if (weekday === 0)
    weekday = 7;

  const start =
    new Date(first);

  start.setDate(
    first.getDate() - weekday + 1
  );

  const today =
    dateString(new Date());

  for (
    let i = 0;
    i < 42;
    i++
  ) {

    const date =
      new Date(start);

    date.setDate(
      start.getDate() + i
    );

    const ds =
      dateString(date);

    const day =
      document.createElement("div");

    day.className = "day";

    if (
      date.getMonth() !==
      displayedMonth.getMonth()
    )
      day.classList.add(
        "other-month"
      );

    if (ds === today)
      day.classList.add(
        "today"
      );

    const number =
      document.createElement("div");

    number.className =
      "day-number";

    number.textContent =
      date.getDate();

    day.appendChild(number);

    const events =
      eventsForDay(ds);

    events
      .slice(0,5)
      .forEach(event => {

        const item =
          document.createElement("div");

        item.className =
          "event";

        item.style.background =
          event.color;

        item.textContent =
          event.text;

        item.onclick =
          function(e) {

            e.stopPropagation();

            editEvent(event.id);

          };

        day.appendChild(item);

      });

    if (events.length > 5) {

      const more =
        document.createElement("div");

      more.className =
        "more";

      more.textContent =
        "+" + (events.length - 5);

      day.appendChild(more);

    }

    day.onclick =
      function() {

        openDay(ds);

      };

    calendar.appendChild(day);
  }
}

function previousMonth() {

  displayedMonth =
    new Date(
      displayedMonth.getFullYear(),
      displayedMonth.getMonth()-1,
      1
    );

  renderCalendar();
}

function nextMonth() {

  displayedMonth =
    new Date(
      displayedMonth.getFullYear(),
      displayedMonth.getMonth()+1,
      1
    );

  renderCalendar();
}

function goToday() {

  const today =
    new Date();

  displayedMonth =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );

  renderCalendar();
}

function buildColors() {

  const container =
    document.getElementById("colors");

  container.innerHTML = "";

  COLORS.forEach(color => {

    const button =
      document.createElement("button");

    button.className =
      "color";

    button.style.background =
      color;

    if (
      color === selectedColor
    )
      button.classList.add(
        "selected"
      );

    button.onclick =
      function() {

        selectedColor =
          color;

        buildColors();
      };

    container.appendChild(button);
  });
}

function openNewEvent(day) {

  editingId = null;

  selectedColor =
    COLORS[0];

  document.getElementById(
    "dialogTitle"
  ).textContent =
    "Nouvel événement";

  document.getElementById(
    "eventText"
  ).value = "";

  document.getElementById(
    "endDate"
  ).value = "";

  document.getElementById(
    "startDate"
  ).value =
    day || dateString(new Date());

  document.getElementById(
    "deleteButton"
  ).style.display =
    "none";

  buildColors();

  document.getElementById(
    "eventDialog"
  ).showModal();
}

function editEvent(id) {

  const events =
    loadEvents();

  const event =
    events.find(
      x => x.id === id
    );

  if (!event)
    return;

  editingId = id;

  selectedColor =
    event.color;

  document.getElementById(
    "dialogTitle"
  ).textContent =
    "Modifier l'événement";

  document.getElementById(
    "eventText"
  ).value =
    event.text;

  document.getElementById(
    "startDate"
  ).value =
    event.start;

  document.getElementById(
    "endDate"
  ).value =
    event.end || "";

  document.getElementById(
    "deleteButton"
  ).style.display =
    "block";

  buildColors();

  document.getElementById(
    "eventDialog"
  ).showModal();
}

function saveEvent() {

  const text =
    document.getElementById(
      "eventText"
    ).value.trim();

  const start =
    document.getElementById(
      "startDate"
    ).value;

  let end =
    document.getElementById(
      "endDate"
    ).value;

  if (!text || !start) {

    alert(
      "Ajoute au moins une date et un événement."
    );

    return;
  }

  if (!end)
    end = start;

  if (end < start) {

    alert(
      "La date de fin doit être après la date de début."
    );

    return;
  }

  let events =
    loadEvents();

  if (editingId) {

    const event =
      events.find(
        x => x.id === editingId
      );

    event.text =
      text;

    event.start =
      start;

    event.end =
      end;

    event.color =
      selectedColor;

  } else {

    events.push({

      id:
        Date.now(),

      text:
        text,

      start:
        start,

      end:
        end,

      color:
        selectedColor

    });
  }

  storeEvents(events);

  closeDialog();

  renderCalendar();
}

function deleteEvent() {

  if (!editingId)
    return;

  if (
    !confirm(
      "Supprimer cet événement ?"
    )
  )
    return;

  let events =
    loadEvents();

  events =
    events.filter(
      e => e.id !== editingId
    );

  storeEvents(events);

  closeDialog();

  renderCalendar();
}

function closeDialog() {

  document.getElementById(
    "eventDialog"
  ).close();
}

function openDay(day) {

  selectedDay =
    day;

  const date =
    new Date(
      day + "T12:00:00"
    );

  document.getElementById(
    "dayTitle"
  ).textContent =
    date.toLocaleDateString(
      "fr-FR",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );

  const container =
    document.getElementById(
      "dayEvents"
    );

  container.innerHTML = "";

  const events =
    eventsForDay(day);

  if (!events.length) {

    container.textContent =
      "Aucun événement.";
  }

  events.forEach(event => {

    const item =
      document.createElement("div");

    item.className =
      "event-list-item";

    item.style.background =
      event.color;

    item.textContent =
      event.text;

    item.onclick =
      function() {

        document.getElementById(
          "dayDialog"
        ).close();

        editEvent(event.id);
      };

    container.appendChild(item);
  });

  document.getElementById(
    "dayDialog"
  ).showModal();
}

function addFromDay() {

  document.getElementById(
    "dayDialog"
  ).close();

  openNewEvent(
    selectedDay
  );
}

function openSearch() {

  document.getElementById(
    "searchInput"
  ).value = "";

  document.getElementById(
    "searchResults"
  ).innerHTML = "";

  document.getElementById(
    "searchDialog"
  ).showModal();

  setTimeout(() => {
    document.getElementById(
      "searchInput"
    ).focus();
  }, 100);
}

function closeSearch() {

  document.getElementById(
    "searchDialog"
  ).close();
}

function searchEvents() {

  const query =
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();

  const results =
    document.getElementById(
      "searchResults"
    );

  results.innerHTML = "";

  if (!query)
    return;

  const events =
    loadEvents()
    .filter(event =>
      event.text
        .toLowerCase()
        .includes(query)
    )
    .sort((a,b) =>
      b.start.localeCompare(a.start)
    );

  if (!events.length) {

    results.innerHTML =
      "<p>Aucun résultat.</p>";

    return;
  }

  events.forEach(event => {

    const item =
      document.createElement("div");

    item.className =
      "search-result";

    item.style.background =
      event.color;

    const date =
      new Date(
        event.start + "T12:00:00"
      );

    const formattedDate =
      date.toLocaleDateString(
        "fr-FR"
      );

    const dateDiv =
      document.createElement("div");

    dateDiv.className =
      "search-date";

    dateDiv.textContent =
      formattedDate;

    const textDiv =
      document.createElement("div");

    textDiv.textContent =
      event.text;

    item.appendChild(dateDiv);
    item.appendChild(textDiv);

    results.appendChild(item);
  });
}

renderCalendar();

</script>

</body>
</html>
