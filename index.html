<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notre Calendrier</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  color: #222;
  overscroll-behavior-x: none;
}

.app {
  max-width: 900px;
  margin: auto;
  min-height: 100vh;
  background: white;
}

.header {
  padding: 14px 10px 8px;
  position: sticky;
  top: 0;
  z-index: 20;
  background: white;
  border-bottom: 1px solid #ddd;
}

.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

h1 {
  margin: 0;
  font-size: 21px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 9px 10px;
  font-size: 14px;
  background: #eee;
}

.month {
  margin-top: 12px;
  font-size: 23px;
  font-weight: bold;
  text-transform: capitalize;
}

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-top: 10px;
  text-align: center;
  color: #777;
  font-size: 12px;
}

.calendar {
  background: white;
  touch-action: pan-y;
}

.week {
  position: relative;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  height: 116px;
  border-left: 1px solid #ddd;
  border-top: 1px solid #ddd;
}

.day {
  position: relative;
  border-right: 1px solid #ddd;
  border-bottom: 1px solid #ddd;
  background: white;
  min-width: 0;
}

.day.other-month {
  background: #fafafa;
  color: #aaa;
}

.day.today {
  box-shadow: inset 0 0 0 2px #30b86b;
}

.day.has-hidden {
  box-shadow: inset 0 -4px 0 #ff9800;
}

.day-number {
  position: absolute;
  top: 3px;
  left: 4px;
  z-index: 3;
  font-size: 11px;
  font-weight: bold;
}

.week-events {
  position: absolute;
  left: 0;
  right: 0;
  top: 23px;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(5, 16px);
  row-gap: 2px;
  pointer-events: none;
  z-index: 5;
}

.event-bar {
  min-width: 0;
  margin-left: 2px;
  margin-right: 2px;
  border-radius: 4px;
  padding: 2px 4px;
  font-size: 10px;
  line-height: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #111;
  pointer-events: auto;
  cursor: pointer;
  z-index: 6;
}

.event-bar.continue-left {
  margin-left: 0;
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
}

.event-bar.continue-right {
  margin-right: 0;
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}

/* INDICATION TRES VISIBLE DES EVENEMENTS CACHES */

.more {
  position: absolute;
  bottom: 4px;
  right: 3px;

  background: #ff9800;
  color: white;

  border-radius: 10px;

  padding: 2px 5px;

  font-size: 9px;
  font-weight: bold;

  z-index: 9;

  box-shadow: 0 1px 3px rgba(0,0,0,.25);
}

.add {
  position: fixed;
  right: 20px;
  bottom: 22px;

  width: 58px;
  height: 58px;

  padding: 0;

  border-radius: 50%;

  background: #1db954;
  color: white;

  font-size: 30px;

  box-shadow: 0 4px 15px #999;

  z-index: 30;
}

dialog {
  width: 92%;
  max-width: 430px;

  border: 0;
  border-radius: 16px;

  padding: 0;
}

dialog::backdrop {
  background: rgba(0,0,0,.4);
}

.modal {
  padding: 18px;
}

.modal h2 {
  margin-top: 0;
}

label {
  display: block;

  margin-top: 12px;
  margin-bottom: 5px;

  font-size: 13px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;

  border: 1px solid #bbb;
  border-radius: 9px;

  padding: 10px;

  font-size: 16px;
}

textarea {
  min-height: 70px;
}

.colors {
  display: flex;
  gap: 10px;

  margin-top: 8px;

  flex-wrap: wrap;
}

.color {
  width: 34px;
  height: 34px;

  padding: 0;

  border-radius: 50%;

  border: 3px solid transparent;
}

.color.selected {
  border-color: #222;
}

.actions {
  margin-top: 16px;

  display: flex;
  gap: 8px;

  justify-content: flex-end;
}

.save {
  background: #222;
  color: white;
}

.delete {
  background: #ffd7d7;
  color: #900;

  margin-right: auto;
}

.event-list-item {
  padding: 10px;

  margin-bottom: 7px;

  border-radius: 8px;

  font-size: 15px;
}

.search-result {
  padding: 10px;

  margin-bottom: 8px;

  border-radius: 8px;

  font-size: 15px;
}

.search-date {
  font-weight: bold;
  margin-bottom: 3px;
}

@media(max-width: 500px) {

  .header {
    padding-left: 7px;
    padding-right: 7px;
  }

  h1 {
    font-size: 18px;
  }

  button {
    padding: 8px 8px;
    font-size: 12px;
  }

  .week {
    height: 108px;
  }

  .week-events {
    grid-template-rows: repeat(5, 15px);
  }

  .event-bar {
    font-size: 9px;
    line-height: 11px;
    padding: 2px 3px;
  }

  .day-number {
    font-size: 10px;
  }

}

</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="topline">

      <h1>Notre Calendrier</h1>

      <div>

        <button onclick="openSearch()">🔍</button>

        <button onclick="previousMonth()">‹</button>

        <button onclick="goToday()">Aujourd'hui</button>

        <button onclick="nextMonth()">›</button>

      </div>

    </div>

    <div class="month" id="monthTitle"></div>

    <div class="weekdays">

      <div>Lun</div>
      <div>Mar</div>
      <div>Mer</div>
      <div>Jeu</div>
      <div>Ven</div>
      <div>Sam</div>
      <div>Dim</div>

    </div>

  </div>

  <div id="calendar" class="calendar"></div>

</div>

<button
  class="add"
  onclick="openNewEvent()">
  +
</button>


<dialog id="eventDialog">

  <div class="modal">

    <h2 id="dialogTitle">
      Nouvel événement
    </h2>

    <label>Date</label>

    <input
      type="date"
      id="startDate">

    <label>Jusqu'au (facultatif)</label>

    <input
      type="date"
      id="endDate">

    <label>Événement</label>

    <textarea
      id="eventText"
      placeholder="Exemple : Piscine 10h"></textarea>

    <label>Couleur</label>

    <div
      class="colors"
      id="colors">
    </div>

    <div class="actions">

      <button
        class="delete"
        id="deleteButton"
        onclick="deleteEvent()">
        Supprimer
      </button>

      <button onclick="closeDialog()">
        Annuler
      </button>

      <button
        class="save"
        onclick="saveEvent()">
        Enregistrer
      </button>

    </div>

  </div>

</dialog>


<dialog id="dayDialog">

  <div class="modal">

    <h2 id="dayTitle"></h2>

    <div id="dayEvents"></div>

    <div class="actions">

      <button onclick="addFromDay()">
        Ajouter
      </button>

      <button
        onclick="document.getElementById('dayDialog').close()">
        Fermer
      </button>

    </div>

  </div>

</dialog>


<dialog id="searchDialog">

  <div class="modal">

    <h2>Rechercher</h2>

    <input
      type="text"
      id="searchInput"
      placeholder="Exemple : mazout"
      oninput="searchEvents()">

    <div
      id="searchResults"
      style="margin-top:15px;">
    </div>

    <div class="actions">

      <button onclick="closeSearch()">
        Fermer
      </button>

    </div>

  </div>

</dialog>


<script>

const COLORS = [

  "#b9ddff",
  "#b9efc6",
  "#ffc5d3",
  "#ffd2a8",
  "#d8c9ff",
  "#d5d5d5"

];

const MAX_LANES = 5;

let displayedMonth = new Date();

displayedMonth =
  new Date(
    displayedMonth.getFullYear(),
    displayedMonth.getMonth(),
    1
  );

let selectedColor = COLORS[0];

let editingId = null;

let selectedDay = null;


/* GESTION DU GLISSEMENT */

let touchStartX = 0;
let touchStartY = 0;

const calendarElement =
  document.getElementById("calendar");


calendarElement.addEventListener(
  "touchstart",
  function(event) {

    if (
      event.touches.length !== 1
    )
      return;

    touchStartX =
      event.touches[0].clientX;

    touchStartY =
      event.touches[0].clientY;

  },
  {
    passive: true
  }
);


calendarElement.addEventListener(
  "touchend",
  function(event) {

    if (
      event.changedTouches.length !== 1
    )
      return;

    const touchEndX =
      event.changedTouches[0].clientX;

    const touchEndY =
      event.changedTouches[0].clientY;


    const deltaX =
      touchEndX - touchStartX;

    const deltaY =
      touchEndY - touchStartY;


    /*
      On considère qu'il s'agit
      d'un vrai glissement horizontal
      à partir de 45 pixels.

      Il doit aussi être plus horizontal
      que vertical.
    */

    if (
      Math.abs(deltaX) < 45
    )
      return;


    if (
      Math.abs(deltaX)
      <=
      Math.abs(deltaY)
    )
      return;


    /*
      Glisser vers la gauche
      = mois suivant
    */

    if (
      deltaX < 0
    ) {

      nextMonth();

    }

    /*
      Glisser vers la droite
      = mois précédent
    */

    else {

      previousMonth();

    }

  },
  {
    passive: true
  }
);


/* DATES */

function dateString(date) {

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      date.getDate()
    ).padStart(2, "0");

  return y + "-" + m + "-" + d;

}


function parseDate(str) {

  const parts =
    str.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

}


function addDays(date, days) {

  const d =
    new Date(date);

  d.setDate(
    d.getDate() + days
  );

  return d;

}


/* STOCKAGE */

function loadEvents() {

  const saved =
    localStorage.getItem(
      "familyCalendar"
    );

  if (!saved)
    return [];

  try {

    return JSON.parse(saved);

  } catch {

    return [];

  }

}


function storeEvents(events) {

  localStorage.setItem(
    "familyCalendar",
    JSON.stringify(events)
  );

}


/* EVENEMENTS D'UN JOUR */

function eventsForDay(day) {

  return loadEvents()
    .filter(event => {

      const end =
        event.end || event.start;

      return (
        event.start <= day &&
        end >= day
      );

    })
    .sort(sortEventsPriority);

}


/* PRIORITES */

function isMultiDay(event) {

  const end =
    event.end || event.start;

  return end > event.start;

}


function eventDuration(event) {

  const start =
    parseDate(event.start);

  const end =
    parseDate(
      event.end || event.start
    );

  return Math.round(
    (end - start)
    / 86400000
  ) + 1;

}


function sortEventsPriority(a, b) {

  const aMulti =
    isMultiDay(a);

  const bMulti =
    isMultiDay(b);


  if (
    aMulti &&
    !bMulti
  )
    return -1;


  if (
    !aMulti &&
    bMulti
  )
    return 1;


  if (
    aMulti &&
    bMulti
  ) {

    const durationDifference =
      eventDuration(b)
      -
      eventDuration(a);

    if (
      durationDifference !== 0
    )
      return durationDifference;

  }


  return (
    a.start.localeCompare(
      b.start
    )
  );

}


/* CALENDRIER */

function renderCalendar() {

  const calendar =
    document.getElementById(
      "calendar"
    );

  calendar.innerHTML = "";


  document.getElementById(
    "monthTitle"
  ).textContent =
    displayedMonth.toLocaleDateString(
      "fr-FR",
      {
        month: "long",
        year: "numeric"
      }
    );


  const first =
    new Date(
      displayedMonth
    );


  let weekday =
    first.getDay();


  if (
    weekday === 0
  )
    weekday = 7;


  const calendarStart =
    new Date(first);


  calendarStart.setDate(
    first.getDate()
    -
    weekday
    +
    1
  );


  for (
    let weekIndex = 0;
    weekIndex < 6;
    weekIndex++
  ) {

    const weekStart =
      addDays(
        calendarStart,
        weekIndex * 7
      );

    renderWeek(
      calendar,
      weekStart
    );

  }

}


/* UNE SEMAINE */

function renderWeek(
  calendar,
  weekStart
) {

  const week =
    document.createElement(
      "div"
    );

  week.className =
    "week";


  const today =
    dateString(
      new Date()
    );


  for (
    let i = 0;
    i < 7;
    i++
  ) {

    const date =
      addDays(
        weekStart,
        i
      );

    const ds =
      dateString(date);


    const day =
      document.createElement(
        "div"
      );

    day.className =
      "day";


    if (
      date.getMonth()
      !==
      displayedMonth.getMonth()
    ) {

      day.classList.add(
        "other-month"
      );

    }


    if (
      ds === today
    ) {

      day.classList.add(
        "today"
      );

    }


    const number =
      document.createElement(
        "div"
      );

    number.className =
      "day-number";

    number.textContent =
      date.getDate();


    day.appendChild(
      number
    );


    day.onclick =
      function() {

        openDay(ds);

      };


    week.appendChild(
      day
    );

  }


  const layer =
    document.createElement(
      "div"
    );

  layer.className =
    "week-events";

  week.appendChild(
    layer
  );


  placeWeekEvents(
    layer,
    week,
    weekStart
  );


  calendar.appendChild(
    week
  );

}


/* PLACEMENT DES EVENEMENTS */

function placeWeekEvents(
  layer,
  week,
  weekStart
) {

  const weekEnd =
    addDays(
      weekStart,
      6
    );


  const weekStartStr =
    dateString(
      weekStart
    );

  const weekEndStr =
    dateString(
      weekEnd
    );


  const allEvents =
    loadEvents();


  const relevant =
    allEvents
    .filter(event => {

      const end =
        event.end
        ||
        event.start;

      return (
        event.start <= weekEndStr
        &&
        end >= weekStartStr
      );

    })
    .sort(
      sortEventsPriority
    );


  const lanes =
    Array.from(
      {
        length:
          MAX_LANES
      },
      () =>
        Array(7).fill(null)
    );


  const hiddenPerDay =
    Array(7).fill(0);


  relevant.forEach(
    event => {

      const eventStart =
        parseDate(
          event.start
        );

      const eventEnd =
        parseDate(
          event.end
          ||
          event.start
        );


      const segmentStart =
        eventStart > weekStart
        ?
        eventStart
        :
        weekStart;


      const segmentEnd =
        eventEnd < weekEnd
        ?
        eventEnd
        :
        weekEnd;


      const startIndex =
        Math.round(
          (
            segmentStart
            -
            weekStart
          )
          /
          86400000
        );


      const endIndex =
        Math.round(
          (
            segmentEnd
            -
            weekStart
          )
          /
          86400000
        );


      let laneFound =
        -1;


      for (
        let lane = 0;
        lane < MAX_LANES;
        lane++
      ) {

        let free =
          true;


        for (
          let d = startIndex;
          d <= endIndex;
          d++
        ) {

          if (
            lanes[lane][d]
            !== null
          ) {

            free =
              false;

            break;

          }

        }


        if (
          free
        ) {

          laneFound =
            lane;

          break;

        }

      }


      if (
        laneFound === -1
      ) {

        for (
          let d = startIndex;
          d <= endIndex;
          d++
        ) {

          hiddenPerDay[d]++;

        }

        return;

      }


      for (
        let d = startIndex;
        d <= endIndex;
        d++
      ) {

        lanes[
          laneFound
        ][d] =
          event.id;

      }


      const bar =
        document.createElement(
          "div"
        );

      bar.className =
        "event-bar";


      if (
        eventStart < weekStart
      ) {

        bar.classList.add(
          "continue-left"
        );

      }


      if (
        eventEnd > weekEnd
      ) {

        bar.classList.add(
          "continue-right"
        );

      }


      bar.style.background =
        event.color;


      bar.style.gridColumn =
        (startIndex + 1)
        +
        " / "
        +
        (endIndex + 2);


      bar.style.gridRow =
        laneFound + 1;


      bar.textContent =
        event.text;


      bar.onclick =
        function(e) {

          e.stopPropagation();

          editEvent(
            event.id
          );

        };


      layer.appendChild(
        bar
      );

  });


  const dayCells =
    week.querySelectorAll(
      ".day"
    );


  hiddenPerDay.forEach(
    (
      hidden,
      index
    ) => {

      if (
        hidden <= 0
      )
        return;


      dayCells[
        index
      ].classList.add(
        "has-hidden"
      );


      const more =
        document.createElement(
          "div"
        );

      more.className =
        "more";


      more.textContent =
        "⚠ +"
        +
        hidden;


      dayCells[
        index
      ].appendChild(
        more
      );

    }
  );

}


/* NAVIGATION */

function previousMonth() {

  displayedMonth =
    new Date(
      displayedMonth.getFullYear(),
      displayedMonth.getMonth() - 1,
      1
    );

  renderCalendar();

}


function nextMonth() {

  displayedMonth =
    new Date(
      displayedMonth.getFullYear(),
      displayedMonth.getMonth() + 1,
      1
    );

  renderCalendar();

}


function goToday() {

  const today =
    new Date();

  displayedMonth =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );

  renderCalendar();

}


/* COULEURS */

function buildColors() {

  const container =
    document.getElementById(
      "colors"
    );

  container.innerHTML = "";


  COLORS.forEach(
    color => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "color";

      button.style.background =
        color;


      if (
        color === selectedColor
      ) {

        button.classList.add(
          "selected"
        );

      }


      button.onclick =
        function() {

          selectedColor =
            color;

          buildColors();

        };


      container.appendChild(
        button
      );

    }
  );

}


/* NOUVEL EVENEMENT */

function openNewEvent(day) {

  editingId =
    null;

  selectedColor =
    COLORS[0];


  document.getElementById(
    "dialogTitle"
  ).textContent =
    "Nouvel événement";


  document.getElementById(
    "eventText"
  ).value =
    "";


  document.getElementById(
    "endDate"
  ).value =
    "";


  document.getElementById(
    "startDate"
  ).value =
    day
    ||
    dateString(
      new Date()
    );


  document.getElementById(
    "deleteButton"
  ).style.display =
    "none";


  buildColors();


  document.getElementById(
    "eventDialog"
  ).showModal();

}


/* MODIFIER */

function editEvent(id) {

  const events =
    loadEvents();


  const event =
    events.find(
      x =>
        x.id === id
    );


  if (
    !event
  )
    return;


  editingId =
    id;


  selectedColor =
    event.color
    ||
    COLORS[0];


  document.getElementById(
    "dialogTitle"
  ).textContent =
    "Modifier l'événement";


  document.getElementById(
    "eventText"
  ).value =
    event.text;


  document.getElementById(
    "startDate"
  ).value =
    event.start;


  document.getElementById(
    "endDate"
  ).value =
    event.end || "";


  document.getElementById(
    "deleteButton"
  ).style.display =
    "block";


  buildColors();


  document.getElementById(
    "eventDialog"
  ).showModal();

}


/* SAUVEGARDER */

function saveEvent() {

  const text =
    document.getElementById(
      "eventText"
    )
    .value
    .trim();


  const start =
    document.getElementById(
      "startDate"
    ).value;


  let end =
    document.getElementById(
      "endDate"
    ).value;


  if (
    !text
    ||
    !start
  ) {

    alert(
      "Ajoute au moins une date et un événement."
    );

    return;

  }


  if (
    !end
  )
    end =
      start;


  if (
    end < start
  ) {

    alert(
      "La date de fin doit être après la date de début."
    );

    return;

  }


  let events =
    loadEvents();


  if (
    editingId
  ) {

    const event =
      events.find(
        x =>
          x.id === editingId
      );


    event.text =
      text;

    event.start =
      start;

    event.end =
      end;

    event.color =
      selectedColor;

  } else {

    events.push({

      id:
        Date.now(),

      text:
        text,

      start:
        start,

      end:
        end,

      color:
        selectedColor

    });

  }


  storeEvents(
    events
  );


  closeDialog();


  renderCalendar();

}


/* SUPPRIMER */

function deleteEvent() {

  if (
    !editingId
  )
    return;


  if (
    !confirm(
      "Supprimer cet événement ?"
    )
  )
    return;


  let events =
    loadEvents();


  events =
    events.filter(
      event =>
        event.id
        !==
        editingId
    );


  storeEvents(
    events
  );


  closeDialog();


  renderCalendar();

}


/* FERMER */

function closeDialog() {

  document.getElementById(
    "eventDialog"
  ).close();

}


/* JOURNEE */

function openDay(day) {

  selectedDay =
    day;


  const date =
    parseDate(
      day
    );


  document.getElementById(
    "dayTitle"
  ).textContent =
    date.toLocaleDateString(
      "fr-FR",
      {
        weekday:
          "long",

        day:
          "numeric",

        month:
          "long"
      }
    );


  const container =
    document.getElementById(
      "dayEvents"
    );


  container.innerHTML =
    "";


  const events =
    eventsForDay(
      day
    );


  if (
    !events.length
  ) {

    container.textContent =
      "Aucun événement.";

  }


  events.forEach(
    event => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "event-list-item";

      item.style.background =
        event.color;

      item.textContent =
        event.text;


      item.onclick =
        function() {

          document.getElementById(
            "dayDialog"
          ).close();


          editEvent(
            event.id
          );

        };


      container.appendChild(
        item
      );

    }
  );


  document.getElementById(
    "dayDialog"
  ).showModal();

}


function addFromDay() {

  document.getElementById(
    "dayDialog"
  ).close();


  openNewEvent(
    selectedDay
  );

}


/* RECHERCHE */

function openSearch() {

  document.getElementById(
    "searchInput"
  ).value =
    "";


  document.getElementById(
    "searchResults"
  ).innerHTML =
    "";


  document.getElementById(
    "searchDialog"
  ).showModal();


  setTimeout(
    () => {

      document.getElementById(
        "searchInput"
      ).focus();

    },
    100
  );

}


function closeSearch() {

  document.getElementById(
    "searchDialog"
  ).close();

}


function searchEvents() {

  const query =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  const results =
    document.getElementById(
      "searchResults"
    );


  results.innerHTML =
    "";


  if (
    !query
  )
    return;


  const events =
    loadEvents()
    .filter(
      event =>
        event.text
        .toLowerCase()
        .includes(
          query
        )
    )
    .sort(
      (a,b) =>
        b.start.localeCompare(
          a.start
        )
    );


  if (
    !events.length
  ) {

    results.innerHTML =
      "<p>Aucun résultat.</p>";

    return;

  }


  events.forEach(
    event => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "search-result";

      item.style.background =
        event.color;


      const date =
        parseDate(
          event.start
        );


      const dateDiv =
        document.createElement(
          "div"
        );

      dateDiv.className =
        "search-date";


      if (
        isMultiDay(
          event
        )
      ) {

        const end =
          parseDate(
            event.end
          );


        dateDiv.textContent =
          date.toLocaleDateString(
            "fr-FR"
          )
          +
          " → "
          +
          end.toLocaleDateString(
            "fr-FR"
          );

      } else {

        dateDiv.textContent =
          date.toLocaleDateString(
            "fr-FR"
          );

      }


      const textDiv =
        document.createElement(
          "div"
        );

      textDiv.textContent =
        event.text;


      item.appendChild(
        dateDiv
      );

      item.appendChild(
        textDiv
      );


      results.appendChild(
        item
      );

    }
  );

}


/* DEMARRAGE */

renderCalendar();

</script>
